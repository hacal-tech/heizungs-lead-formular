<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heizungs-Beratung – In 3 Minuten zum passenden Angebot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5EF;
    --card-bg:#FFFFFF;
    --border:#E1DCCB;
    --border-hover:#1B3A4B;
    --ink:#16222B;
    --ink-soft:#63707A;
    --primary:#1B3A4B;
    --primary-dark:#122631;
    --accent:#C9A24B;
    --accent-dark:#96762A;
    --pale:#E7ECEE;
    --radius:16px;
    --shadow:0 2px 10px rgba(20,30,25,.05);
    --shadow-hover:0 10px 26px rgba(27,58,75,.16);
    --font-display:'Baloo 2','Poppins',sans-serif;
    --font-body:'Inter',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}

  .topbar{background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;}
  .topbar-inner{max-width:1040px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:1.25rem;color:var(--ink);}
  .logo-badge{width:34px;height:34px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .logo-badge svg{width:20px;height:20px;}
  .logo b{color:var(--accent-dark);}
  .trust{font-size:.82rem;color:var(--ink-soft);font-weight:500;display:flex;align-items:center;gap:6px;}
  .trust svg{width:15px;height:15px;flex-shrink:0;}
  @media (max-width:560px){ .trust span{display:none;} }

  .wizard{max-width:1000px;margin:0 auto;padding:40px 20px 110px;min-height:60vh;}

  .step-top{display:flex;align-items:center;justify-content:space-between;min-height:30px;margin-bottom:18px;}
  .back-btn{background:none;border:none;color:var(--ink-soft);font-family:var(--font-body);font-weight:600;font-size:.92rem;cursor:pointer;display:flex;align-items:center;gap:2px;padding:6px 10px 6px 4px;border-radius:8px;visibility:hidden;}
  .back-btn.visible{visibility:visible;}
  .back-btn:hover{background:var(--pale);color:var(--primary-dark);}
  .step-counter{font-size:.78rem;color:var(--ink-soft);font-weight:600;letter-spacing:.02em;}

  .eyebrow{text-align:center;font-family:var(--font-display);font-weight:800;font-size:clamp(1.6rem,3.4vw,2.3rem);margin:0 0 6px;color:var(--ink);}
  .eyebrow-sub{text-align:center;color:var(--accent-dark);font-weight:700;font-size:1.02rem;margin:0 0 34px;}

  .step-header{text-align:center;margin-bottom:34px;}
  .step-header h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.35rem,2.5vw,1.9rem);line-height:1.3;margin:0 0 8px;color:var(--ink);}
  .step-header .muted{color:var(--ink-soft);font-weight:400;font-size:.96rem;max-width:520px;margin:6px auto 0;line-height:1.5;}

  .options-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;}

  .option-card{
    width:190px;min-height:180px;background:var(--card-bg);border:1.5px solid var(--border);border-radius:var(--radius);
    padding:26px 14px 18px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;
    cursor:pointer;text-align:center;transition:border-color .16s ease, box-shadow .16s ease, transform .16s ease,background .16s ease;
    box-shadow:var(--shadow);
  }
  .option-card:hover,.option-card:focus-visible{border-color:var(--border-hover);box-shadow:var(--shadow-hover);transform:translateY(-3px);outline:none;}
  .option-card.selected{border-color:var(--primary);background:var(--pale);}
  .icon-wrap{width:60px;height:60px;position:relative;flex-shrink:0;}
  .icon-wrap svg{width:100%;height:100%;display:block;}
  .icon-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-top:12px;font-family:var(--font-display);font-weight:800;font-size:.64rem;line-height:1.05;color:var(--primary);white-space:pre-line;text-align:center;pointer-events:none;}
  .option-card .label{font-weight:700;font-size:.95rem;line-height:1.3;color:var(--ink);}
  .option-card .sub-label{font-size:.74rem;color:var(--ink-soft);margin-top:-8px;font-weight:500;}
  .option-card .tag{font-size:.7rem;color:var(--accent-dark);margin-top:-6px;font-weight:600;}

  @media (max-width:640px){
    .option-card{width:calc(50% - 8px);min-height:160px;padding:20px 10px 16px;}
    .icon-wrap{width:50px;height:50px;}
  }
  @media (max-width:380px){ .option-card{width:100%;} }

  .input-panel{max-width:460px;margin:0 auto;}
  .field-label{display:block;font-size:.82rem;font-weight:600;color:var(--ink-soft);margin:0 0 6px;}
  .text-input,.form-input,select.form-input{width:100%;padding:15px 16px;border:1.5px solid var(--border);border-radius:12px;font-family:var(--font-body);font-size:1rem;background:#fff;color:var(--ink);}
  .text-input:focus,.form-input:focus{outline:none;border-color:var(--primary);}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  @media (max-width:520px){ .form-row{grid-template-columns:1fr;} }

  .gender-row{display:flex;gap:10px;margin-bottom:16px;}
  .gender-pill{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:.92rem;color:var(--ink);transition:border-color .15s;}
  .gender-pill:hover{border-color:var(--primary);}
  .gender-pill .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;position:relative;transition:border-color .15s;}
  .gender-pill.active{border-color:var(--primary);background:var(--pale);}
  .gender-pill.active .dot{border-color:var(--primary);}
  .gender-pill.active .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--primary);}

  .consent{font-size:.76rem;color:var(--ink-soft);line-height:1.5;margin:14px 0 18px;}
  .consent a{color:var(--primary-dark);text-decoration:underline;}

  .code-input{text-align:center;letter-spacing:.55em;font-weight:700;font-size:1.15rem;}
  .field-error{color:#c0392b;font-size:.85rem;margin-top:10px;}
  .demo-note{margin-top:14px;background:#FFF6E2;border:1px solid #F0D48A;color:#8A6D1D;font-size:.8rem;line-height:1.5;padding:10px 12px;border-radius:10px;}
  #resendBtn{display:block;margin:14px auto 0;}
  #phoneEntry .primary-btn{margin-top:14px;}

  .primary-btn{width:100%;padding:16px;background:var(--primary);color:#fff;border:none;border-radius:12px;font-family:var(--font-body);font-weight:700;font-size:1.02rem;cursor:pointer;transition:background .15s;}
  .primary-btn:hover:not(:disabled){background:var(--primary-dark);}
  .primary-btn:disabled{opacity:.45;cursor:not-allowed;}

  .thankyou{text-align:center;max-width:560px;margin:24px auto 0;}
  .thankyou-badge{width:84px;height:84px;border-radius:50%;background:var(--pale);border:2px solid var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;}
  .thankyou-badge svg{width:38px;height:38px;}
  .thankyou h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.5rem,3vw,2rem);margin:0 0 12px;}
  .thankyou p{color:var(--ink-soft);font-size:1rem;line-height:1.6;margin:0 0 26px;}
  .summary-card{background:var(--card-bg);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px 22px;text-align:left;margin-bottom:26px;}
  .summary-row{display:flex;justify-content:space-between;padding:9px 0;font-size:.9rem;border-bottom:1px solid var(--border);}
  .summary-row:last-child{border-bottom:none;}
  .summary-row span:first-child{color:var(--ink-soft);}
  .summary-row span:last-child{font-weight:700;color:var(--ink);text-align:right;}
  .reset-btn{background:none;border:none;color:var(--primary-dark);font-weight:700;font-size:.9rem;cursor:pointer;text-decoration:underline;}

  .progress-track{position:fixed;left:0;bottom:0;width:100%;height:6px;background:var(--border);z-index:50;}
  .progress-fill{height:100%;background:var(--primary);width:0%;transition:width .35s ease;}

  .step-anim{animation:fadeSlide .3s ease;}
  @keyframes fadeSlide{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){
    .step-anim{animation:none;}
    .option-card{transition:none;}
    .option-card:hover,.option-card:focus-visible{transform:none;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <span class="logo-badge">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M32 10 C24 20 18 26 18 36 C18 45 24 51 32 51 C40 51 46 45 46 36 C46 30 42 26 40 22 C39 28 35 30 33 28 C31 25 34 20 32 10 Z" fill="#fff" opacity="0.95"/>
        </svg>
      </span>
      <span>Wärme<b>Check</b></span>
    </div>
    <div class="trust">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5 L10 17 L19 7" stroke="#1B3A4B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Kostenlos &amp; unverbindlich</span>
    </div>
  </div>
</header>

<main class="wizard" id="wizard"></main>

<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

<script>
/* ---------------------------------------------------------
   Lead-Qualifizierungs-Formular – "WärmeCheck"
   Einfache, gerüstartige Vorlage nach dem Vorbild eines
   mehrstufigen Heizungs-Beratungsformulars.

   Integrationshinweis: Der finale Submit-Handler (siehe
   Funktion submitLead()) ist der Punkt, an dem die Daten an
   ein Backend gesendet werden – z.B. per fetch() an einen
   Make.com-Webhook oder die HubSpot-Forms-API, um die Leads
   automatisch in die Lead-Scoring-Pipeline einzuspeisen.

   Telefon-Verifizierung (Schritt 12): In dieser Vorschau wird
   der Code nur clientseitig simuliert (siehe sendCode() im
   'phone'-Schritt) und als "Demo-Modus"-Hinweis eingeblendet,
   da eine echte SMS niemals aus dem Browser heraus verschickt
   werden kann/darf (das erfordert ein Geheimnis/API-Key, das
   nicht im Frontend liegen darf). Für den echten SMS-Versand:
   sendCode() so umbauen, dass sie die Telefonnummer per fetch()
   an ein Backend (z.B. Make.com-Szenario mit Twilio-/Vonage-
   Modul, oder eine kleine Serverless-Function) schickt, dieses
   Backend generiert den Code, verschickt die SMS und speichert
   den Code serverseitig; verifyBtn prüft die Nutzereingabe dann
   per zweitem fetch() gegen dieses Backend statt gegen
   state._demoCode.
--------------------------------------------------------- */

const PRIMARY = "var(--primary)"; // Navy - Hauptfarbe der Icon-Silhouetten
const ACCENT  = "var(--accent)";  // Messing - Akzentflächen
const PALE    = "var(--pale)";    // helle Fläche, z.B. Kalenderblatt

function svg(inner){ return `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`; }

// Alle Icons sind bewusst als flache, einfarbige Silhouetten (Navy + Messing)
// gezeichnet - kein Duotone-Umriss-Stil, damit sie sich klar von anderen
// Anbietern in diesem Marktsegment unterscheiden.
const ICONS = {
  heatpump: svg(`<rect x="8" y="16" width="48" height="32" rx="8" fill="${PRIMARY}"/><circle cx="22" cy="32" r="8" fill="${ACCENT}"/><rect x="36" y="24" width="14" height="4" rx="2" fill="${ACCENT}"/><rect x="36" y="31" width="14" height="4" rx="2" fill="${ACCENT}"/><rect x="36" y="38" width="10" height="4" rx="2" fill="${ACCENT}"/>`),
  flame: svg(`<path d="M32 8 C22 20 16 28 16 38 C16 48 23 56 32 56 C41 56 48 48 48 38 C48 31 43 26 40 22 C40 29 35 31 33 28 C31 25 35 18 32 8 Z" fill="${PRIMARY}"/><path d="M32 30 C28 35 26 39 26 43 C26 48 29 51 32 51 C35 51 38 48 38 43 C38 40 36 37 34 35 C34 39 31 40 30 38 C29 36 32 33 32 30 Z" fill="${ACCENT}"/>`),
  droplet: svg(`<path d="M32 8 C41 22 50 33 50 42 C50 51 42 58 32 58 C22 58 14 51 14 42 C14 33 23 22 32 8 Z" fill="${PRIMARY}"/><ellipse cx="24" cy="40" rx="4" ry="6" fill="${ACCENT}"/>`),
  logs: svg(`<circle cx="22" cy="42" r="10" fill="${PRIMARY}"/><circle cx="42" cy="42" r="10" fill="${PRIMARY}"/><circle cx="32" cy="24" r="10" fill="${PRIMARY}"/><circle cx="22" cy="42" r="3.2" fill="${ACCENT}"/><circle cx="42" cy="42" r="3.2" fill="${ACCENT}"/><circle cx="32" cy="24" r="3.2" fill="${ACCENT}"/>`),
  plug: svg(`<rect x="16" y="24" width="32" height="20" rx="8" fill="${PRIMARY}"/><rect x="22" y="12" width="6" height="14" rx="2" fill="${ACCENT}"/><rect x="36" y="12" width="6" height="14" rx="2" fill="${ACCENT}"/><path d="M32 44 V50 C32 54 29 57 25 57 H19" fill="none" stroke="${PRIMARY}" stroke-width="5" stroke-linecap="round"/>`),
  gascylinder: svg(`<rect x="22" y="16" width="20" height="38" rx="8" fill="${PRIMARY}"/><rect x="27" y="8" width="10" height="10" rx="3" fill="${ACCENT}"/><path d="M27 32 c0 -4 10 -4 10 0 c0 4 -10 4 -10 8 c0 4 10 4 10 0" fill="none" stroke="${ACCENT}" stroke-width="2.4" stroke-linecap="round"/>`),
  cranehouse: svg(`<rect x="12" y="18" width="4" height="36" rx="2" fill="${PRIMARY}"/><rect x="12" y="18" width="30" height="4" rx="2" fill="${PRIMARY}"/><rect x="8" y="52" width="14" height="4" rx="2" fill="${PRIMARY}"/><path d="M12 18 L20 10 L24 18 Z" fill="${PRIMARY}"/><path d="M38 44 L48 38 L58 44 V54 H38 Z" fill="${ACCENT}"/>`),
  question: svg(`<path d="M22 20 C22 12 42 10 42 22 C42 30 33 30 33 38" fill="none" stroke="${PRIMARY}" stroke-width="7" stroke-linecap="round"/><circle cx="33" cy="49" r="4.5" fill="${ACCENT}"/>`),
  house1: svg(`<path d="M32 10 L54 28 V56 H10 V28 Z" fill="${PRIMARY}"/><rect x="26" y="38" width="12" height="18" fill="${ACCENT}"/><rect x="17" y="32" width="7" height="7" fill="${ACCENT}"/><rect x="40" y="32" width="7" height="7" fill="${ACCENT}"/>`),
  house2: svg(`<path d="M18 12 L34 24 V56 H2 V24 Z" fill="${PRIMARY}"/><path d="M46 12 L62 24 V56 H30 V24 Z" fill="${PRIMARY}" opacity="0.75"/><rect x="30" y="24" width="4" height="32" fill="${ACCENT}"/><rect x="12" y="40" width="8" height="16" fill="${ACCENT}"/><rect x="42" y="40" width="8" height="16" fill="${ACCENT}"/>`),
  apartment: svg(`<rect x="14" y="12" width="36" height="44" rx="2" fill="${PRIMARY}"/><rect x="21" y="20" width="6" height="6" fill="${ACCENT}"/><rect x="34" y="20" width="6" height="6" fill="${ACCENT}"/><rect x="21" y="32" width="6" height="6" fill="${ACCENT}"/><rect x="34" y="32" width="6" height="6" fill="${ACCENT}"/><rect x="21" y="44" width="6" height="6" fill="${ACCENT}"/><rect x="34" y="44" width="6" height="6" fill="${ACCENT}"/>`),
  condo: svg(`<rect x="14" y="12" width="36" height="44" rx="2" fill="${PRIMARY}"/><rect x="14" y="12" width="14" height="44" fill="${ACCENT}"/><rect x="19" y="22" width="4" height="4" fill="${PALE}"/><rect x="19" y="34" width="4" height="4" fill="${PALE}"/><rect x="34" y="22" width="6" height="6" fill="${ACCENT}"/><rect x="34" y="36" width="6" height="6" fill="${ACCENT}"/>`),
  factory: svg(`<path d="M10 56 V30 L20 38 V30 L30 38 V30 L40 38 V56 Z" fill="${PRIMARY}"/><rect x="40" y="20" width="16" height="36" fill="${PRIMARY}" opacity="0.8"/><rect x="45" y="8" width="6" height="14" fill="${ACCENT}"/><rect x="16" y="46" width="6" height="6" fill="${ACCENT}"/><rect x="45" y="30" width="6" height="6" fill="${ACCENT}"/><rect x="45" y="42" width="6" height="6" fill="${ACCENT}"/>`),
  calendar: svg(`<rect x="10" y="10" width="44" height="10" rx="4" fill="${ACCENT}"/><rect x="10" y="18" width="44" height="36" rx="4" fill="${PALE}"/><rect x="18" y="4" width="5" height="12" rx="2" fill="${PRIMARY}"/><rect x="41" y="4" width="5" height="12" rx="2" fill="${PRIMARY}"/>`),
  waterheaterCentral: svg(`<rect x="10" y="26" width="12" height="26" rx="4" fill="${PRIMARY}"/><rect x="14" y="18" width="4" height="8" fill="${PRIMARY}"/><rect x="26" y="14" width="28" height="40" rx="5" fill="${PRIMARY}" opacity="0.85"/><circle cx="40" cy="30" r="6" fill="${ACCENT}"/><rect x="22" y="36" width="6" height="4" fill="${PRIMARY}"/>`),
  waterheaterSeparate: svg(`<rect x="16" y="10" width="32" height="42" rx="7" fill="${PRIMARY}"/><circle cx="32" cy="26" r="8" fill="${ACCENT}"/><rect x="30" y="21" width="2.5" height="7" fill="${PRIMARY}"/><rect x="30" y="25" width="7" height="2.5" fill="${PRIMARY}"/><rect x="14" y="52" width="5" height="7" fill="${PRIMARY}"/><rect x="45" y="52" width="5" height="7" fill="${PRIMARY}"/>`),
  solar: svg(`<circle cx="32" cy="12" r="6" fill="${ACCENT}"/><path d="M32 2 V6 M22 6 L25 9 M42 6 L39 9" stroke="${ACCENT}" stroke-width="2.6" stroke-linecap="round"/><path d="M18 46 L24 24 L40 24 L46 46 Z" fill="${PRIMARY}"/><rect x="23" y="30" width="18" height="3" fill="${PALE}"/><rect x="21" y="38" width="22" height="3" fill="${PALE}"/><path d="M14 56 L50 56 L44 46 L20 46 Z" fill="${PRIMARY}" opacity="0.8"/>`),
  radiator: svg(`<rect x="14" y="14" width="36" height="38" rx="4" fill="${PRIMARY}"/><rect x="21" y="14" width="4" height="38" fill="${ACCENT}"/><rect x="30" y="14" width="4" height="38" fill="${ACCENT}"/><rect x="39" y="14" width="4" height="38" fill="${ACCENT}"/><circle cx="46" cy="10" r="4" fill="${ACCENT}"/>`),
  underfloor: svg(`<path d="M10 24 q6 -10 12 0 q6 10 12 0 q6 -10 12 0 q6 10 12 0" fill="none" stroke="${PRIMARY}" stroke-width="5" stroke-linecap="round"/><path d="M10 38 q6 -10 12 0 q6 10 12 0 q6 -10 12 0 q6 10 12 0" fill="none" stroke="${PRIMARY}" stroke-width="5" stroke-linecap="round" opacity="0.6"/><rect x="8" y="50" width="48" height="6" rx="3" fill="${ACCENT}"/>`),
  radiatorUnderfloor: svg(`<g transform="translate(-6,-6) scale(0.58)"><rect x="14" y="14" width="36" height="38" rx="4" fill="${PRIMARY}"/><rect x="21" y="14" width="4" height="38" fill="${ACCENT}"/><rect x="30" y="14" width="4" height="38" fill="${ACCENT}"/><rect x="39" y="14" width="4" height="38" fill="${ACCENT}"/></g><g transform="translate(14,18) scale(0.58)"><path d="M10 30 q6 -10 12 0 q6 10 12 0 q6 -10 12 0" fill="none" stroke="${PRIMARY}" stroke-width="5" stroke-linecap="round"/><rect x="8" y="44" width="40" height="5" rx="2.5" fill="${ACCENT}"/></g><rect x="10" y="10" width="44" height="3" fill="${ACCENT}" opacity="0.7" transform="rotate(38 32 32)"/>`),
  check: svg(`<path d="M12 34 L26 48 L52 18" fill="none" stroke="${ACCENT}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`),
  cross: svg(`<path d="M18 18 L46 46 M46 18 L18 46" fill="none" stroke="${PRIMARY}" stroke-width="8" stroke-linecap="round"/>`),
  coins: svg(`<ellipse cx="24" cy="42" rx="16" ry="8" fill="${PRIMARY}"/><ellipse cx="24" cy="36" rx="16" ry="8" fill="${ACCENT}"/><ellipse cx="40" cy="26" rx="16" ry="8" fill="${PRIMARY}"/><ellipse cx="40" cy="20" rx="16" ry="8" fill="${ACCENT}"/>`),
  person: svg(`<circle cx="32" cy="20" r="11" fill="${PRIMARY}"/><path d="M12 56 C12 40 20 34 32 34 C44 34 52 40 52 56 Z" fill="${ACCENT}"/>`),
  people: svg(`<circle cx="22" cy="18" r="9" fill="${PRIMARY}"/><path d="M6 52 C6 39 13 34 22 34 C31 34 38 39 38 52 Z" fill="${ACCENT}"/><circle cx="44" cy="20" r="8" fill="${PRIMARY}" opacity="0.75"/><path d="M32 52 C32 41 37 36 44 36 C51 36 56 41 56 52 Z" fill="${ACCENT}" opacity="0.75"/>`),
};

function areaIcon(scaleIdx){
  const sizes=[16,22,28,34,40,46];
  const s=sizes[scaleIdx-1]||34;
  const w=s, h=s*0.82, x0=12, yBase=50, y1=yBase-h, x1=x0+w;
  return svg(`
    <rect x="${x0}" y="${y1}" width="${w}" height="${h}" rx="3" fill="${PRIMARY}"/>
    <path d="M${x0-2} ${y1+6} L${x0-2} ${y1-2} L${x0+6} ${y1-2} Z" fill="${ACCENT}"/>
    <path d="M${x1-6} ${yBase+2} L${x1+2} ${yBase+2} L${x1+2} ${yBase-6} Z" fill="${ACCENT}"/>
  `);
}

function iconFor(opt){
  if(opt.icon==='area') return areaIcon(opt.size);
  return ICONS[opt.icon] || ICONS.question;
}

// ---------------------------------------------------------
// Schritte des Formulars
// ---------------------------------------------------------
const STEPS = [
  { id:'zukunft', type:'choice', eyebrow:'Die 3-Minuten-Heizungs-Beratung', eyebrowSub:'Jetzt bis zu 80% Förderung sichern',
    headline:'Womit möchten Sie in Zukunft heizen?', options:[
      { value:'waermepumpe', label:'Wärmepumpe', icon:'heatpump', tag:'Bis 80% Förderung' },
      { value:'holzpellets', label:'Holz/Pellets', icon:'logs', tag:'Bis 80% Förderung' },

      { value:'holzpellets', label:'Holz/Pellets', icon:'logs' },
      { value:'strom', label:'Strom', icon:'plug' },
      { value:'fluessiggas', label:'Flüssiggas', icon:'gascylinder' },
      { value:'neubau', label:'Erstinstallation/ Neubauprojekt', icon:'cranehouse' },

      { value:'dhh', label:'Doppel- oder Reihenhaus', icon:'house2' },
      { value:'mfh', label:'Mehrfamilienhaus', icon:'apartment' },
      { value:'eigentumswohnung', label:'Eigentumswohnung', icon:'condo' },
      { value:'gewerbe', label:'Gewerbe', icon:'factory' },
    ]},
  { id:'baujahr', type:'choice', headline:'Wann wurde das Gebäude errichtet?', options:[
      { value:'vor1994', label:'Vor 1994', icon:'calendar', overlay:'Vor\n1994' },
      { value:'1995-2001', label:'1995 - 2001', icon:'calendar', overlay:'1995-\n2001' },
      { value:'2002-heute', label:'2002 - heute', icon:'calendar', overlay:'2002-\nheute' },
      { value:'imbau', label:'Objekt im Bau', icon:'cranehouse' },
    ]},
  { id:'flaeche', type:'choice', headline:'Wie groß ist die zu beheizende Fläche?', options:[

      { value:'181-250', label:'181 - 250 m²', icon:'area', size:4 },
      { value:'251-400', label:'251 - 400 m²', icon:'area', size:5 },
      { value:'mehr400', label:'Mehr als 400 m²', icon:'area', size:6 },
    ]},
  { id:'warmwasser', type:'choice', headline:'Wie wird aktuell Warmwasser erzeugt?', options:[
      { value:'zentral', label:'Zentral über Heizung', icon:'waterheaterCentral' },
      { value:'separat', label:'Separat', sub:'(z.B. Durchlauferhitzer)', icon:'waterheaterSeparate' },
      { value:'solarthermie', label:'Solarthermie', icon:'solar' },
      { value:'weissnicht', label:'Weiß nicht/ Sonstiges', icon:'question' },
    ]},
  { id:'raumheizung', type:'choice', headline:'Wie werden Ihre Räume derzeit beheizt?', options:[
      { value:'heizkoerper', label:'Heizkörper', icon:'radiator' },
      { value:'fussboden', label:'Fußbodenheizung', icon:'underfloor' },
      { value:'beide', label:'Heizkörper & Fußbodenheizung', icon:'radiatorUnderfloor' },
      { value:'sonstiges', label:'Sonstiges', icon:'question' },
    ]},
  { id:'zeitrahmen', type:'choice', headline:'Wann wären Sie bereit die neue Heizung einbauen zu lassen?', options:[
      { value:'sofort', label:'So schnell wie möglich', icon:'calendar', overlay:'Sofort' },
      { value:'1-3', label:'1 bis 3 Monate', icon:'calendar', overlay:'1 - 3\nMonate' },
      { value:'4-6', label:'4 bis 6 Monate', icon:'calendar', overlay:'4 - 6\nMonate' },
      { value:'7-12', label:'7 bis 12 Monate', icon:'calendar', overlay:'7 - 12\nMonate' },
      { value:'12plus', label:'Erst nach 12 Monaten', icon:'calendar', overlay:'> 12\nMonate' },
    ]},
  { id:'budget', type:'choice', headline:'Welches Budget haben Sie für Ihr Projekt eingeplant?', options:[
      { value:'unter_1000', label:'Unter 1.000 €', icon:'coins' },
      { value:'1000_5000', label:'1.000 € – 5.000 €', icon:'coins' },
      { value:'5000_15000', label:'5.000 € – 15.000 €', icon:'coins' },
      { value:'ueber_15000', label:'Über 15.000 €', icon:'coins' },
      { value:'unklar', label:'Weiß ich noch nicht', icon:'question' },
    ]},
  { id:'entscheidung', type:'choice', headline:'Sind Sie befugt, die Entscheidung für dieses Projekt zu treffen?', options:[
      { value:'allein', label:'Ja, ich entscheide allein', icon:'person' },
      { value:'gemeinsam', label:'Ja, gemeinsam mit Partner/in', icon:'people' },
      { value:'nur_info', label:'Nein, ich hole nur Informationen ein', icon:'question' },
    ]},
  { id:'eigentuemer', type:'choice', headline:'Sind Sie Eigentümer:in oder Entscheider:in?', options:[
      { value:'ja', label:'Ja', icon:'check' },
      { value:'nein', label:'Nein', icon:'cross' },
    ]},
  { id:'plz', type:'text', headline:'In welcher Region sollen wir für Sie suchen?',
    subtitle:'Auf Basis Ihrer Postleitzahl suchen wir passende Fachfirmen in Ihrer Region.', placeholder:'Postleitzahl' },
  { id:'kontakt', type:'form', headline:'Wer soll die Angebote erhalten?' },
  { id:'telefon', type:'phone', headline:'Wie lautet Ihre Telefonnummer?',
    subtitle:'Wir senden Ihnen zur Bestätigung einen Code per SMS.' },
];

const LABELS = {}; // value -> readable label, built from STEPS for the summary screen
STEPS.forEach(s=>{ if(s.options){ LABELS[s.id]={}; s.options.forEach(o=>LABELS[s.id][o.value]=o.label); } });

// ---------------------------------------------------------
// State
// ---------------------------------------------------------
let state = { stepIndex:0, answers:{}, completed:false };

const wizardEl = document.getElementById('wizard');
const progressFillEl = document.getElementById('progressFill');

function updateProgress(){
  const pct = state.completed ? 100 : (state.stepIndex/STEPS.length)*100;
  progressFillEl.style.width = pct + '%';
}

function goBack(){
  if(state.stepIndex>0){ state.stepIndex -= 1; render(); }
}

function advance(){
  if(state.stepIndex < STEPS.length-1){
    state.stepIndex += 1; render();
  } else {
    state.completed = true; render();
  }
}

function selectChoice(step, value){
  state.answers[step.id] = value;
  advance();
}

function optionCardHtml(step, opt){
  const selected = state.answers[step.id]===opt.value ? 'selected' : '';
  const overlay = opt.overlay ? `<div class="icon-overlay">${opt.overlay}</div>` : '';
  const sub = opt.sub ? `<div class="sub-label">${opt.sub}</div>` : '';
  const tag = opt.tag ? `<div class="tag">${opt.tag}</div>` : '';
  return `
    <div class="option-card ${selected}" role="button" tabindex="0" data-value="${opt.value}" data-step="${step.id}">
      <div class="icon-wrap">${iconFor(opt)}${overlay}</div>
      <div class="label">${opt.label}</div>
      ${sub}${tag}
    </div>`;
}

function render(){
  const step = state.completed ? null : STEPS[state.stepIndex];
  updateProgress();

  if(state.completed){ renderThankYou(); return; }

  const showBack = state.stepIndex>0;
  const eyebrowHtml = step.eyebrow ? `<div class="eyebrow">${step.eyebrow}</div><div class="eyebrow-sub">${step.eyebrowSub||''}</div>` : '';

  let bodyHtml = '';
  if(step.type==='choice'){
    bodyHtml = `<div class="options-grid">${step.options.map(o=>optionCardHtml(step,o)).join('')}</div>`;
  } else if(step.type==='text'){
    bodyHtml = `
      <div class="input-panel">
        <input class="text-input" id="plzInput" type="text" inputmode="numeric" maxlength="5" placeholder="${step.placeholder}" value="${state.answers.plz||''}">
        <button class="primary-btn" style="margin-top:14px" id="plzNext">Weiter</button>
      </div>`;
  } else if(step.type==='form'){
    const a = state.answers.kontakt || {};
    bodyHtml = `
      <div class="input-panel">
        <div class="gender-row">
          <div class="gender-pill ${a.anrede==='Herr'||!a.anrede?'active':''}" data-gender="Herr"><span class="dot"></span>Herr</div>
          <div class="gender-pill ${a.anrede==='Frau'?'active':''}" data-gender="Frau"><span class="dot"></span>Frau</div>
        </div>
        <div class="form-row">
          <input class="form-input" id="vorname" placeholder="Vorname*" value="${a.vorname||''}">
          <input class="form-input" id="nachname" placeholder="Nachname*" value="${a.nachname||''}">
        </div>
        <div class="form-row" style="grid-template-columns:1fr;">
          <input class="form-input" id="email" type="email" placeholder="E-Mail*" value="${a.email||''}">
        </div>
        <div class="consent">Mit Klick auf den untenstehenden Button lege ich mein Kundenkonto an, akzeptiere die <a href="#">AGB</a> und bestätige, die <a href="#">Datenschutzerklärung</a> zur Kenntnis genommen zu haben. Wir können Ihnen Informationen über ähnliche Produkte und Leistungen per E-Mail zusenden. Ein kostenloser Widerspruch ist jederzeit <a href="#">hier</a> möglich.</div>
        <button class="primary-btn" id="formNext">Weiter</button>
      </div>`;
  } else if(step.type==='phone'){
    bodyHtml = `
      <div class="input-panel">
        <div id="phoneEntry">
          <input class="text-input" id="phoneInput" type="tel" placeholder="+49 151 23456789" value="${state.answers.telefon||''}">
          <button class="primary-btn" id="sendCodeBtn">Code per SMS senden</button>
        </div>
        <div id="codeSection" style="display:none;">
          <p class="muted" style="margin:18px 0 12px;">Code gesendet an <strong id="sentTo"></strong> · <a href="#" id="changeNumber" style="color:var(--primary-dark);font-weight:600;">Nummer ändern</a></p>
          <input class="text-input code-input" id="codeInput" type="text" inputmode="numeric" maxlength="6" placeholder="123456">
          <button class="primary-btn" id="verifyBtn">Code bestätigen</button>
          <button class="reset-btn" id="resendBtn">Code erneut senden</button>
          <div class="demo-note" id="demoNote"></div>
        </div>
        <div class="field-error" id="phoneError" style="display:none;"></div>
      </div>`;
  }

  wizardEl.innerHTML = `
    <div class="step-anim">
      <div class="step-top">
        <button class="back-btn ${showBack?'visible':''}" id="backBtn">&#8249; Zurück</button>
        <div class="step-counter">Schritt ${state.stepIndex+1} / ${STEPS.length}</div>
      </div>
      ${eyebrowHtml}
      <div class="step-header">
        <h1>${step.headline}</h1>
        ${step.subtitle ? `<p class="muted">${step.subtitle}</p>` : ''}
      </div>
      ${bodyHtml}
    </div>`;

  // wire events
  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.addEventListener('click', goBack);

  if(step.type==='choice'){
    wizardEl.querySelectorAll('.option-card').forEach(card=>{
      card.addEventListener('click', ()=> selectChoice(step, card.dataset.value));
      card.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'||e.key===' '){ e.preventDefault(); selectChoice(step, card.dataset.value); }
      });
    });
  }

  if(step.type==='text'){
    const input = document.getElementById('plzInput');
    const btn = document.getElementById('plzNext');
    const trySubmit = ()=>{
      const val = input.value.trim();
      if(/^\d{5}$/.test(val)){ state.answers.plz = val; advance(); }
      else { input.style.borderColor = '#c0392b'; input.focus(); }
    };
    btn.addEventListener('click', trySubmit);
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); trySubmit(); } });
    input.addEventListener('input', ()=>{ input.style.borderColor=''; });
    input.focus();
  }

  if(step.type==='form'){
    let gender = (state.answers.kontakt && state.answers.kontakt.anrede) || 'Herr';
    wizardEl.querySelectorAll('.gender-pill').forEach(pill=>{
      pill.addEventListener('click', ()=>{
        gender = pill.dataset.gender;
        wizardEl.querySelectorAll('.gender-pill').forEach(p=>p.classList.toggle('active', p.dataset.gender===gender));
      });
    });
    document.getElementById('formNext').addEventListener('click', ()=>{
      const vorname = document.getElementById('vorname').value.trim();
      const nachname = document.getElementById('nachname').value.trim();
      const email = document.getElementById('email').value.trim();
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      let ok = true;
      [['vorname',vorname],['nachname',nachname],['email',emailOk?'x':'']].forEach(([id,val])=>{
        const el = document.getElementById(id);
        if(!val){ el.style.borderColor='#c0392b'; ok=false; } else { el.style.borderColor=''; }
      });
      if(!ok) return;
      state.answers.kontakt = { anrede:gender, vorname, nachname, email };
      advance();
    });
  }

  if(step.type==='phone'){
    const phoneEntry = document.getElementById('phoneEntry');
    const phoneInput = document.getElementById('phoneInput');
    const sendBtn = document.getElementById('sendCodeBtn');
    const codeSection = document.getElementById('codeSection');
    const codeInput = document.getElementById('codeInput');
    const verifyBtn = document.getElementById('verifyBtn');
    const resendBtn = document.getElementById('resendBtn');
    const sentToEl = document.getElementById('sentTo');
    const demoNote = document.getElementById('demoNote');
    const errorEl = document.getElementById('phoneError');
    const changeNumberLink = document.getElementById('changeNumber');
    let cooldownTimer = null;

    function validPhone(v){ return /^\+?\d{6,15}$/.test(v.replace(/[\s\-\/]/g,'')); }
    function showError(msg){ errorEl.textContent = msg; errorEl.style.display = 'block'; }
    function clearError(){ errorEl.style.display = 'none'; }

    function startCooldown(){
      let secs = 30;
      resendBtn.disabled = true;
      resendBtn.textContent = `Code erneut senden (${secs}s)`;
      clearInterval(cooldownTimer);
      cooldownTimer = setInterval(()=>{
        secs -= 1;
        if(secs<=0){ clearInterval(cooldownTimer); resendBtn.disabled=false; resendBtn.textContent='Code erneut senden'; }
        else { resendBtn.textContent = `Code erneut senden (${secs}s)`; }
      },1000);
    }

    function sendCode(){
      const val = phoneInput.value.trim();
      if(!validPhone(val)){
        phoneInput.style.borderColor = '#c0392b';
        showError('Bitte eine gültige Telefonnummer eingeben.');
        return;
      }
      phoneInput.style.borderColor = '';
      clearError();
      state.answers.telefon = val;

      // ---- Hier andocken: echten SMS-Code verschicken ----
      // In Produktion NIE clientseitig generieren/anzeigen - siehe Hinweis
      // in submitLead()/sendVerificationCode() weiter unten im Code.
      state._demoCode = String(Math.floor(100000 + Math.random()*900000));
      console.log('SMS-Code (Demo, kein echter Versand):', state._demoCode);

      sentToEl.textContent = val;
      phoneEntry.style.display = 'none';
      codeSection.style.display = 'block';
      demoNote.textContent = 'Demo-Modus – kein SMS-Backend verbunden. Test-Code: ' + state._demoCode;
      codeInput.value = '';
      codeInput.style.borderColor = '';
      codeInput.focus();
      startCooldown();
    }

    sendBtn.addEventListener('click', sendCode);
    phoneInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); sendCode(); } });
    phoneInput.addEventListener('input', ()=>{ phoneInput.style.borderColor=''; clearError(); });

    resendBtn.addEventListener('click', ()=>{ if(!resendBtn.disabled) sendCode(); });

    changeNumberLink.addEventListener('click', (e)=>{
      e.preventDefault();
      clearInterval(cooldownTimer);
      codeSection.style.display = 'none';
      phoneEntry.style.display = 'block';
      clearError();
      phoneInput.focus();
    });

    verifyBtn.addEventListener('click', ()=>{
      const val = codeInput.value.trim();
      if(val && val === state._demoCode){
        clearInterval(cooldownTimer);
        clearError();
        state.phoneVerified = true;

        // ---- Hier andocken: Lead an Backend senden ----
        submitLead(state.answers);

        state.completed = true;
        render();
      } else {
        codeInput.style.borderColor = '#c0392b';
        showError('Der Code ist leider nicht korrekt.');
      }
    });
    codeInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); verifyBtn.click(); } });
    codeInput.addEventListener('input', ()=>{ codeInput.style.borderColor=''; clearError(); });
  }

  window.scrollTo({top:0, behavior:'smooth'});
}

function submitLead(answers){
  fetch('https://hook.eu2.make.com/1ryatii2bhsfoqprbb20nrr3n7b6furg', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(answers)
  }).catch(err => console.error('Lead-Übertragung fehlgeschlagen:', err));
  console.log('Lead erfasst und an Make.com gesendet:', answers);
}

function renderThankYou(){
  const a = state.answers;
  const name = (a.kontakt && a.kontakt.vorname) || '';
  wizardEl.innerHTML = `
    <div class="step-anim thankyou">
      <div class="thankyou-badge">${ICONS.check}</div>
      <h1>Vielen Dank${name?', '+name:''}!</h1>
      <p>Wir gleichen Ihre Angaben jetzt mit passenden Fachbetrieben ${a.plz? 'im Raum '+a.plz : 'in Ihrer Region'} ab und melden uns in Kürze telefonisch oder per E-Mail.</p>
      <div class="summary-card">
        ${summaryRow('Zukünftige Heizung', labelOf('zukunft', a.zukunft))}
        ${summaryRow('Aktuelle Heizung', labelOf('aktuell', a.aktuell))}
        ${summaryRow('Gebäudetyp', labelOf('gebaeudetyp', a.gebaeudetyp))}
        ${summaryRow('Baujahr', labelOf('baujahr', a.baujahr))}
        ${summaryRow('Fläche', labelOf('flaeche', a.flaeche))}
        ${summaryRow('Zeitrahmen', labelOf('zeitrahmen', a.zeitrahmen))}
        ${summaryRow('PLZ', a.plz||'–')}
        ${summaryRow('Telefon', (a.telefon||'–') + (state.phoneVerified ? ' ✓ verifiziert' : ''))}
      </div>
      <button class="reset-btn" id="resetBtn">Neue Anfrage starten</button>
    </div>`;
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    state = { stepIndex:0, answers:{}, completed:false };
    render();
  });
  window.scrollTo({top:0, behavior:'smooth'});
}

function labelOf(stepId, value){
  if(!value) return '–';
  return (LABELS[stepId] && LABELS[stepId][value]) || value;
}
function summaryRow(label, value){
  return `<div class="summary-row"><span>${label}</span><span>${value}</span></div>`;
}

render();
</script>
